spring.application.name=timetablescheduler

# Server
server.port=8080

# Data file paths (relative to working directory when running mvn spring-boot:run)
# Adjust if running from a different directory
data.base.path=../

# Solver settings
solver.timeLimitSeconds=300
# 0 = use all available CPU cores
solver.numWorkers=0
# Stop when incumbent is within this fraction of the proven bound (soft PR-MATH objective).
# Set to 0 to always prove OPTIMAL (slower).
solver.relativeGapLimit=0.1
# CP-SAT per-iteration search log (verbose); keep off in normal runs
solver.logProgress=false

# Logging
logging.level.com.example.timetablescheduler=INFO
logging.level.root=WARN

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Auto-open Swagger UI in browser on application startup (true/false)
app.open-browser-on-startup=true
